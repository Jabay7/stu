name: Build Android app

# Builds an installable APK in the cloud, because the project is developed on
# Windows without Node or the Android SDK installed. Every run uploads the APK
# as a downloadable artifact; tagging v* also attaches it to a Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v5

      - name: Collect web assets
        run: uv run scripts/build_www.py

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the run
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="stu-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: stu-android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
